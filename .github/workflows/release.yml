name: Build and publish MyTools
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - run: npm run check
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Collect mytools.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $installer.FullName release/mytools.exe
          Copy-Item ($installer.FullName + '.sig') release/mytools.exe.sig
          if ((Get-Item release/mytools.exe).Length -gt 10000000) { throw 'Installer exceeds 10 MB sharing budget' }
      - name: Build Linux app and packages
        if: runner.os == 'Linux'
        run: npm run build -- --config src-tauri/tauri.linux.conf.json
      - name: Package compact Linux edition
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release stage
          cp src-tauri/target/release/mytools stage/mytools
          cp scripts/install-linux.sh stage/install.sh
          cp build-icon.svg stage/mytools.svg
          chmod 755 stage/mytools stage/install.sh
          tar -czf release/mytools-linux-x86_64.tar.gz -C stage mytools install.sh mytools.svg
          npm run tauri -- signer sign release/mytools-linux-x86_64.tar.gz
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: mytools-${{ runner.os }}
          path: release/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: node scripts/release-manifest.mjs release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --title "MyTools $VERSION" --notes-file RELEASE_NOTES.md
          gh release upload "v$VERSION" release/* --clobber
