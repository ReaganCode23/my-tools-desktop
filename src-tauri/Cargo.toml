[package]
name = "mytools"
version = "1.1.0"
description = "A compact, private desktop toolkit"
authors = ["ReaganCode23"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
flate2 = "1"
tar = "0.4"
argon2 = { version = "0.5.3", features = ["zeroize"] }
aes-gcm = "0.10.3"
aes = { version = "0.8", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
updater-smoke = []
vault-smoke = []
